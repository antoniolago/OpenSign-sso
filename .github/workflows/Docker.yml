name: ci

permissions:
  contents: read
  id-token: write
  packages: write

on:
  push:
    branches:
      - 'main'
      - 'staging'

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: ghcr.io/antoniolago/opensign-client
            dockerfile: apps/OpenSign/Dockerfile
          - image: ghcr.io/antoniolago/opensign-server
            dockerfile: apps/OpenSignServer/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Always login to GHCR
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Detect if Harbor is configured (secrets not available in `if:` directly)
      - name: Check Harbor configuration
        id: harbor-check
        env:
          HARBOR_URL: ${{ secrets.HARBOR_URL }}
        run: |
          if [ -n "$HARBOR_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      # Login to Harbor only if configured
      - name: Login to Harbor
        if: steps.harbor-check.outputs.configured == 'true'
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.HARBOR_URL }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Optional: tag & push existing multi-arch image to Harbor
      - name: Push to Harbor
        if: steps.harbor-check.outputs.configured == 'true'
        env:
          HARBOR_URL: ${{ secrets.HARBOR_URL }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          HARBOR_BASE="$HARBOR_URL/${{ matrix.image }}"
          docker buildx imagetools create \
            --tag "$HARBOR_BASE:latest" \
            --tag "$HARBOR_BASE:${BRANCH}" \
            --tag "$HARBOR_BASE:${BRANCH}-${SHA::7}" \
            "${{ steps.meta.outputs.tags }}"
