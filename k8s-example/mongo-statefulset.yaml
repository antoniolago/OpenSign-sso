apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensign-mongo
  namespace: opensign
  labels:
    app.kubernetes.io/name: opensign-mongo
spec:
  serviceName: opensign-mongo
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opensign-mongo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensign-mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
              name: mongodb
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
